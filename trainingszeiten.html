<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anzeige – Trainingszeiten</title>
  <style>
    :root { --bg:#000; --text:#fff; --card:#fff; }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100vh; display:flex; flex-direction:column;
    }

    /* Header mit Logos */
    .header{
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 16px; gap:12px;
    }
    .header img{ height:80px; width:auto; object-fit:contain; }
    @media (max-width:750px){ .header img{ height:44px; } }
    @media (max-width:480px){ .header img{ height:40px; } }

    /* Wochenübersicht wie bei den Probetrainings */
    .wrap{flex:1;width:100%;padding:14px 14px 75px}
    .week{background:#181818;border:1px solid #444;border-radius:10px;overflow:hidden}
    .week-title{background:#252525;padding:12px 14px;font-weight:bold;font-size:20px}
    .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
    .day{min-width:0;border-right:1px solid #333}.day:last-child{border-right:0}
    .dayhead{background:#222;padding:12px 5px;text-align:center;font-weight:bold;border-bottom:1px solid #333}
    .slot{margin:8px;border:1px solid #555;border-radius:8px;overflow:hidden;overflow-wrap:anywhere}
    .time{background:#333;padding:8px 5px;text-align:center;font-weight:bold}
    .content{background:#111;padding:10px 8px;min-height:78px}
    .what{font-weight:bold;margin-bottom:8px}.trainers{font-size:14px;color:#ccc}
    .free{color:#888;text-align:center;padding:22px 5px;font-size:14px}
    .status{color:#aaa;padding:12px;text-align:center}
    @media(max-width:1000px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}.day{border-bottom:1px solid #333}}
    @media(max-width:620px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:360px){.days{grid-template-columns:1fr}}

    /* Home-Button */
    .home-btn{
      position:fixed; left:18px; bottom:18px; border:none;
      background:#fff; color:#000; border-radius:50%;
      padding:10px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.35);
    }
    .home-btn img{ width:32px; height:32px; display:block; }
  </style>
</head>
<body>
  <!-- Header / Logos -->
  <div class="header" id="header">
    <img id="logo-left" src="pluslogo.png" alt="Logo links">
    <img id="logo-center" src="faust.jpg" alt="Logo Mitte">
    <img id="logo-right" src="melsungen.jpg" alt="Logo rechts">
  </div>

  <main class="wrap"><section class="week" aria-label="Wöchentlicher Trainingsplan">
    <div class="week-title">Regelmäßige Trainingszeiten</div>
    <div id="status" class="status">Trainingszeiten werden geladen …</div>
    <div id="schedule" class="days"></div>
  </section></main>

  <!-- Home -->
  <button class="home-btn" onclick="location.href='hauptseite.html'">
    <img src="home.jpg" alt="Home">
  </button>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // ---------- Firebase Init ----------
    if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

    // ---------- Hilfsfunktion zum Laden von Logos ----------
    function preloadAndSet(imgEl, url) {
      const test = new Image();
      test.onload = () => { imgEl.src = url; };
      test.onerror = () => {};
      test.src = url;
    }

    const DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
    function addText(parent,cls,value){const el=document.createElement('div');el.className=cls;el.textContent=value;parent.appendChild(el);return el;}
    async function loadTrainings(school){
      const snap=await db.collection('trainingszeiten').doc(school).collection('trainingszeiten').get();
      const trainings=snap.docs.map(d=>d.data());
      const root=document.getElementById('schedule');root.replaceChildren();
      for(const name of DAYS){
        const day=document.createElement('div');day.className='day';
        addText(day,'dayhead',name);
        const items=trainings.filter(t=>t.day===name).sort((a,b)=>(a.start||'').localeCompare(b.start||'') || (a.order??9999)-(b.order??9999));
        if(!items.length)addText(day,'free','Kein Training');
        for(const t of items){
          const slot=document.createElement('article');slot.className='slot';
          addText(slot,'time',`${t.start||''} – ${t.end||''}`);
          const content=document.createElement('div');content.className='content';
          addText(content,'what',t.what||'Training');
          addText(content,'trainers','Ausbilder: '+(Array.isArray(t.trainers)?t.trainers.join(', '):'') .trim().replace(/Ausbilder: $/,'Ausbilder: –'));
          slot.appendChild(content);day.appendChild(slot);
        }
        root.appendChild(day);
      }
      document.getElementById('status').textContent=trainings.length?'':'Noch keine Trainingszeiten eingetragen.';
    }

    // ---------- Auth + Schul-Header ----------
    auth.onAuthStateChanged(async (user) => {
      if (!user) { location.href = "index.html"; return; }

      try {
        // Aktive Schule bestimmen
        let activeSchool = (sessionStorage.getItem('activeSchool') || '').trim().toLowerCase();
        let baseSchool   = (sessionStorage.getItem('school') || '').trim().toLowerCase();

        if (!activeSchool && !baseSchool) {
          const snap = await db.collection('rollen').doc(user.uid).get();
          if (snap.exists) {
            const data = snap.data();
            baseSchool = (data.school || '').toLowerCase();
            sessionStorage.setItem('school', baseSchool);
          }
        }

        const school = activeSchool || baseSchool || 'master';

        const logoLeft   = document.getElementById('logo-left');
        const logoCenter = document.getElementById('logo-center');
        const logoRight  = document.getElementById('logo-right');

        // Logos laden
        if (school !== 'master') {
          const base = `logos/${school}`;
          preloadAndSet(logoCenter, `${base}/logo-center.jpg`);
          preloadAndSet(logoLeft,   `${base}/logo-left.jpg`);
          preloadAndSet(logoRight,  `${base}/logo-right.jpg`);
        }

        await loadTrainings(school);

      } catch (e) {
        console.error('[Header/School]', e);
        document.getElementById("status").textContent="Trainingszeiten konnten nicht geladen werden.";
      }
    });
  </script>
</body>
</html>
