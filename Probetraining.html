<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WT+ | Probetrainings</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:#1b1b1b;
    padding:18px;
    text-align:center;
    border-bottom:2px solid #444;
}

h1{
    margin:0;
    font-size:28px;
}

#calendar{
    padding:20px;
}

.week{
    margin-bottom:30px;
    background:#1c1c1c;
    border:1px solid #444;
    border-radius:10px;
    overflow:hidden;
}

.week-title{
    background:#2a2a2a;
    padding:12px;
    font-size:20px;
    font-weight:bold;
}

.days{
    display:grid;
    grid-template-columns:repeat(5,1fr);
}

.day{
    border-right:1px solid #333;
    border-top:1px solid #333;
    min-height:470px;
}

.day:last-child{
    border-right:none;
}

.day-header{
    background:#262626;
    padding:10px;
    text-align:center;
    font-weight:bold;
    border-bottom:1px solid #333;
}

.slot{
    margin:10px;
    border:1px solid #555;
    border-radius:8px;
    overflow:hidden;
}

.slot-time{
    background:#303030;
    padding:6px;
    text-align:center;
    font-weight:bold;
}

.slot-content{
    background:#181818;
    min-height:70px;
    padding:8px;
}

.empty{
    color:#777;
    text-align:center;
    margin-top:18px;
}

.person{
    font-weight:bold;
}

.age{
    color:#bdbdbd;
    font-size:13px;
    margin-top:4px;
}

.present{
    margin-top:8px;
    font-size:13px;
}

@media(max-width:1200px){
.days{
display:block;
}
.day{
min-height:auto;
}
}
</style>
</head>

<body>

<header>
<h1>Probetrainings</h1>
<div>Vergangene Woche • Aktuelle Woche • +2 Wochen</div>
</header>

<div id="calendar"></div>

<script>

const trainingTimes=[
"17:00",
"18:00",
"19:30",
"20:30"
];

const weekLabels=[
"Vergangene Woche",
"Aktuelle Woche",
"Nächste Woche",
"Übernächste Woche"
];

const dayNames=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];

function monday(date){
    const d=new Date(date);
    const day=(d.getDay()+6)%7;
    d.setDate(d.getDate()-day);
    d.setHours(0,0,0,0);
    return d;
}

function kw(date){
    const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
    d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
    const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
    return Math.ceil((((d-yearStart)/86400000)+1)/7);
}

const calendar=document.getElementById("calendar");
const currentMonday=monday(new Date());

for(let w=-1;w<=2;w++){

    const weekStart=new Date(currentMonday);
    weekStart.setDate(currentMonday.getDate()+w*7);

    const week=document.createElement("div");
    week.className="week";

    const title=document.createElement("div");
    title.className="week-title";
    title.textContent=`KW ${kw(weekStart)} - ${weekLabels[w+1]}`;
    week.appendChild(title);

    const days=document.createElement("div");
    days.className="days";

    for(let d=0;d<5;d++){

        const date=new Date(weekStart);
        date.setDate(weekStart.getDate()+d);

        const day=document.createElement("div");
        day.className="day";

        const header=document.createElement("div");
        header.className="day-header";
        header.innerHTML=`${dayNames[d]}<br>${date.toLocaleDateString("de-DE")}`;
        day.appendChild(header);

        trainingTimes.forEach(time=>{

            const slot=document.createElement("div");
            slot.className="slot";

            slot.innerHTML=`
            <div class="slot-time">${time}</div>
            <div class="slot-content">
                <div class="empty">frei</div>
            </div>
            `;

            day.appendChild(slot);

        });

        days.appendChild(day);

    }

    week.appendChild(days);
    calendar.appendChild(week);

}

</script>

</body>
</html>
