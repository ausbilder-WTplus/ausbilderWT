<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snackliste</title>
  <style>
    :root { --bg:#000; --text:#fff; --card:#fff; --muted:#888; }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
      -webkit-font-smoothing:antialiased;
    }

    /* Header (3 Logos, Master als Logofallback) */
    .header{
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 16px; gap:12px; border-bottom:1px solid rgba(255,255,255,.12);
    }
    .header img{ height:80px; width:auto; object-fit:contain; transition:opacity .3s ease; }
    @media (max-width:750px){ .header img{ height:44px; } }
    @media (max-width:480px){ .header img{ height:40px; } }

    /* Inhalt */
    .wrap{
      flex:1; display:flex; flex-direction:column; align-items:center;
      gap:16px; padding:16px;
    }
    .toolbar{
      width:95%; max-width:960px; display:flex; justify-content:space-between; align-items:center;
      gap:12px; margin-top:6px;
    }
    .toolbar .info { color:var(--muted); }

    /* Termin hinzufügen */
    .add-box{
      width:95%; max-width:960px; background:var(--card); color:#111;
      border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.35);
      padding:12px; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    }
    .add-box label{ font-weight:bold; }
    .add-box input[type="date"]{
      padding:10px; border:1px solid #ddd; border-radius:10px;
    }
    .btn {
      background:#000; color:#fff; border:none; border-radius:12px;
      padding:10px 14px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.35);
    }
    .btn.secondary { background:#666; }
    .btn[disabled]{ opacity:.6; cursor:default; }

    .msg{
      width:95%; max-width:960px; min-height:40px; background:#fff; color:#111;
      border-radius:8px; display:flex; align-items:center; padding:8px 10px;
    }
    .msg.ok{ background:#e7ffe7; }

    .list{
      width:95%; max-width:960px; display:grid; gap:12px;
      grid-template-columns: 1fr;
    }
    .card{
      background:var(--card); color:#111; border-radius:12px;
      box-shadow:0 4px 16px rgba(0,0,0,.35); padding:14px;
      display:flex; flex-direction:column; gap:12px;
    }
    .date { font-weight:bold; }
    .assignee { color:#333; }
    .free { color:#0a7f00; font-weight:bold; }
    .note-input { width:100%; border:1px solid #ddd; border-radius:8px; padding:8px; }

    .date{font-size:19px}
    .date-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .delete-date{background:#fff2f2;color:#a40000;border:1px solid #dfaaaa;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:bold}
    .delete-date:hover{background:#ffdede}
    .entry-row{display:grid;grid-template-columns:1fr 2fr auto;align-items:center;gap:12px;border-top:1px solid #ddd;padding:10px 0}
    .entry-row span{overflow-wrap:anywhere}
    .trash{background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;cursor:pointer;font-size:19px}
    .entry-form{display:grid;grid-template-columns:1fr 2fr auto;gap:10px}
    .entry-form input{min-width:0;padding:10px;border:1px solid #ccc;border-radius:9px;font:inherit}
    .entry-form button{font-size:22px}
    .empty{color:#666}
    @media(max-width:600px){.entry-form{grid-template-columns:1fr auto}.entry-form input:nth-child(2){grid-column:1}.entry-form button{grid-column:2;grid-row:1/3}.entry-row{grid-template-columns:1fr auto}.entry-row span:nth-child(2){grid-column:1}.entry-row button{grid-column:2;grid-row:1/3}}

    /* Home-Button (runde, weiße FAB links unten) */
    .home-btn{
      position:fixed; left:18px; bottom:18px; border:none;
      background:#fff; color:#000; border-radius:50%;
      padding:10px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.35);
      z-index:1000;
    }
    .home-btn img{ width:32px; height:32px; display:block; }

    @media (max-width:720px){
      .card{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Header (Master-Logos als Default; JS setzt je Schule um) -->
  <div class="header" id="header">
    <img id="logo-left"   src="logos/master/logo-left.jpg"   alt="Logo links">
    <img id="logo-center" src="logos/master/logo-center.jpg" alt="Logo Mitte">
    <img id="logo-right"  src="logos/master/logo-right.jpg"  alt="Logo rechts">
  </div>

  <div class="wrap">
    <div class="toolbar">
      <h2>Snackliste</h2>
      <div class="info" id="userInfo"></div>
    </div>

    <!-- Termin an beliebigem Datum hinzufügen -->
    <div class="add-box">
      <label for="datePicker">Neuen Termin hinzufügen:</label>
      <input type="date" id="datePicker" />
      <button class="btn" id="addBtn">Termin hinzufügen</button>
    </div>

    <div id="msg" class="msg"></div>

    <div class="list" id="list"></div>
  </div>

  <!-- Home -->
  <button class="home-btn" onclick="location.href='hauptseite.html'">
    <img src="home.jpg" alt="Home">
  </button>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>

  <!-- Zentrale Firebase-Config -->
  <script src="firebase-config.js"></script>

  <script>
    /* =========================
       Firebase Init (zentral)
       ========================= */
    if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

    /* =========================
       Header: einheitliche 3-Logo-Logik
       ========================= */
    function preloadAndSet(img, url, fallback){
      if (!img) return;
      const t = new Image();
      t.onload = ()=>{ img.src = url; img.style.opacity='1'; };
      t.onerror = ()=>{ if (fallback) img.src = fallback; };
      img.style.opacity = '0.3';
      t.src = url;
    }
    function applyHeaderBySchool(school){
      const left   = document.getElementById('logo-left');
      const center = document.getElementById('logo-center');
      const right  = document.getElementById('logo-right');
      const masterBase = 'logos/master';
      const key = String(school||'master').toLowerCase();
      const base = key !== 'master' ? `logos/${key}` : masterBase;
      preloadAndSet(left,   `${base}/logo-left.jpg`,   `${masterBase}/logo-left.jpg`);
      preloadAndSet(center, `${base}/logo-center.jpg`, `${masterBase}/logo-center.jpg`);
      preloadAndSet(right,  `${base}/logo-right.jpg`,  `${masterBase}/logo-right.jpg`);
    }
    const normSchool = s => String(s||'MASTER').trim().toLowerCase();

    /* =========================
       Helpers
       ========================= */
    const $ = (s)=>document.querySelector(s);
    const msg = (t, ok=false)=>{
      const box = $("#msg");
      box.textContent = t || " ";
      box.classList.toggle("ok", ok);
    };
    const z2 = n => String(n).padStart(2,"0");
    const toDateId = d => `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`;
    const fmtDate = d => d.toLocaleDateString("de-DE",{weekday:"long", year:"numeric", month:"2-digit", day:"2-digit"});
    function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    /* =========================
       Schulkontext & Collection Helper (pro Schule!)
       snacks/{schoolKey}/items/{dateId}
       ========================= */
    let CURRENT_SCHOOL = 'master';
    const SNACKS = () => db.collection('snacks').doc(CURRENT_SCHOOL).collection('items');

    /* Termin an beliebigem Wochentag hinzufügen */
    $("#addBtn").addEventListener("click", async ()=>{
      const val = $("#datePicker").value;
      if (!val) { msg("Bitte ein Datum auswählen."); return; }

      const [Y,Mo,D] = val.split("-").map(n=>parseInt(n,10));
      const d = new Date(Y, Mo-1, D);

      const today = startOfDay(new Date());
      if (d < today) { msg("Datum darf nicht in der Vergangenheit liegen."); return; }

      const id = toDateId(d);
      const ref = SNACKS().doc(id); // <-- pro Schule

      msg("Leeren Termin anlegen …");
      try {
        await db.runTransaction(async (tx)=>{
          const snap = await tx.get(ref);
          if (snap.exists) throw new Error("exists");
          tx.set(ref, {
            dateId: id,
            date: firebase.firestore.Timestamp.fromDate(d),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        });
        msg("Termin angelegt.", true);
        $("#datePicker").value = "";
        renderList(auth.currentUser);
      } catch(e){
        msg(e.message === "exists" ? "Für dieses Datum existiert bereits ein Eintrag." : "Konnte Termin nicht anlegen.");
      }
    });

    /* =========================
       Einträge je Termin verwalten
       ========================= */
    function makeId(){
      return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
        `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }
    async function addEntry(dateId, name, brought){
      if (!auth.currentUser) { location.href = 'index.html'; return; }
      name=name.trim(); brought=brought.trim();
      if (!name || !brought){ msg('Bitte beide Felder ausfüllen.'); return false; }
      try{
        const ref=SNACKS().doc(dateId);
        await db.runTransaction(async tx=>{
          const snap=await tx.get(ref);
          if (!snap.exists) throw new Error('Termin nicht vorhanden');
          const entries=Array.isArray(snap.data().entries) ? [...snap.data().entries] : [];
          entries.push({id:makeId(),name,brought});
          tx.update(ref,{entries,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
        });
        await renderList();
        msg('Eintrag hinzugefügt.',true);
        return true;
      }catch(e){ console.error(e);msg('Eintrag konnte nicht gespeichert werden. Bitte Firebase-Regeln prüfen.');return false; }
    }
    async function deleteEntry(dateId,entryId){
      if (!auth.currentUser) { location.href='index.html';return; }
      if (!confirm('Diesen Eintrag wirklich löschen?')) return;
      try{
        const ref=SNACKS().doc(dateId);
        await db.runTransaction(async tx=>{
          const snap=await tx.get(ref);
          if (!snap.exists) throw new Error('Termin nicht vorhanden');
          const entries=Array.isArray(snap.data().entries) ? snap.data().entries : [];
          tx.update(ref,{entries:entries.filter(e=>e.id!==entryId),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
        });
        await renderList();
        msg('Eintrag gelöscht.',true);
      }catch(e){console.error(e);msg('Löschen fehlgeschlagen. Bitte Firebase-Regeln prüfen.');}
    }
    // Bestehende Einträge des alten Systems werden angezeigt und können ebenfalls gelöscht werden.
    async function deleteLegacy(dateId){
      if (!auth.currentUser) { location.href='index.html';return; }
      if (!confirm('Diesen bisherigen Eintrag wirklich löschen?')) return;
      try{
        await SNACKS().doc(dateId).update({
          assigneeUid:firebase.firestore.FieldValue.delete(),
          assigneeName:firebase.firestore.FieldValue.delete(),
          note:firebase.firestore.FieldValue.delete(),
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        await renderList();msg('Eintrag gelöscht.',true);
      }catch(e){console.error(e);msg('Löschen fehlgeschlagen.');}
    }
    async function deleteDate(dateId, formattedDate){
      if (!auth.currentUser) { location.href='index.html'; return; }
      // Löschen des Termins entfernt auch alle darin gespeicherten Snack-Einträge.
      if (!confirm(`Den gesamten Termin ${formattedDate} inklusive aller Snack-Einträge wirklich löschen?\n\nDieser Vorgang kann nicht rückgängig gemacht werden.`)) return;
      try {
        await SNACKS().doc(dateId).delete();
        await renderList();
        msg('Termin und alle zugehörigen Einträge gelöscht.', true);
      } catch(e) {
        console.error(e);
        msg('Termin konnte nicht gelöscht werden. Bitte Firebase-Berechtigungen prüfen.');
      }
    }

    async function renderList(){
      const container=$('#list');container.replaceChildren();
      try{
        const today=startOfDay(new Date());
        const snap=await SNACKS().where('date','>=',firebase.firestore.Timestamp.fromDate(today))
          .orderBy('date','asc').limit(30).get();
        if(snap.empty){msg('Noch keine Termine angelegt. Lege oben einen Termin an.');return;}
        msg('');
        snap.docs.forEach(doc=>{
          const data=doc.data();
          const date=data.date?.toDate ? data.date.toDate() : new Date(doc.id+'T12:00:00');
          const card=document.createElement('section');card.className='card';
          const header=document.createElement('div');header.className='date-header';
          const title=document.createElement('div');title.className='date';title.textContent=fmtDate(date);
          const deleteButton=document.createElement('button');deleteButton.type='button';
          deleteButton.className='delete-date';deleteButton.textContent='🗑️ Termin löschen';
          deleteButton.setAttribute('aria-label','Gesamten Termin '+fmtDate(date)+' löschen');
          deleteButton.onclick=()=>deleteDate(doc.id,fmtDate(date));
          header.append(title,deleteButton);card.appendChild(header);
          const entries=Array.isArray(data.entries)?data.entries:[];
          const all=[...(data.assigneeName?[{name:data.assigneeName,brought:data.note||'Keine Angabe',legacy:true}]:[]),...entries];
          if(!all.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Noch keine Snacks eingetragen.';card.appendChild(empty);}
          all.forEach(entry=>{
            const row=document.createElement('div');row.className='entry-row';
            const name=document.createElement('span');name.textContent=entry.name||'';
            const brought=document.createElement('span');brought.textContent=entry.brought||'';
            const del=document.createElement('button');del.type='button';del.className='trash';del.textContent='🗑️';del.title='Eintrag löschen';
            del.setAttribute('aria-label','Eintrag von '+(entry.name||'Unbekannt')+' löschen');
            del.onclick=()=>entry.legacy?deleteLegacy(doc.id):deleteEntry(doc.id,entry.id);
            row.append(name,brought,del);card.appendChild(row);
          });
          const form=document.createElement('form');form.className='entry-form';
          const name=document.createElement('input');name.placeholder='Name';name.required=true;name.maxLength=100;name.setAttribute('aria-label','Name');
          const brought=document.createElement('input');brought.placeholder='Was bringe ich mit?';brought.required=true;brought.maxLength=500;brought.setAttribute('aria-label','Was bringe ich mit?');
          const add=document.createElement('button');add.className='btn';add.type='submit';add.textContent='+';add.title='Eintrag hinzufügen';
          form.append(name,brought,add);
          form.onsubmit=async e=>{e.preventDefault();add.disabled=true;const ok=await addEntry(doc.id,name.value,brought.value);if(!ok)add.disabled=false;};
          card.appendChild(form);container.appendChild(card);
        });
      }catch(e){console.error(e);msg('Termine konnten nicht geladen werden.');}
    }

    /* =========================
       Auth-Flow + aktiver Schulkontext + Header setzen
       ========================= */
    auth.onAuthStateChanged(async (user)=>{
      if (!user) { location.href = "index.html"; return; }
      $("#userInfo").textContent = user.email || "";

      // Aktive Schule: bevorzugt 'activeSchool' (von Hauptseite), sonst 'school', sonst Firestore
      let school = (sessionStorage.getItem('activeSchool') || sessionStorage.getItem('school') || '').trim().toLowerCase();
      if (!school){
        try{
          const snap = await db.collection('rollen').doc(user.uid).get();
          if (snap.exists){
            school = (snap.data().school || '').toLowerCase();
            sessionStorage.setItem('school', school);
          }
        }catch(e){
          console.warn('[rollen] Fallback fehlgeschlagen', e);
        }
      }
      CURRENT_SCHOOL = normSchool(school || 'master');

      // Header auf Schule setzen
      applyHeaderBySchool(CURRENT_SCHOOL);

      // Liste rendern (im Schul-Kontext)
      renderList(user);
    });
  </script>
</body>
</html>
