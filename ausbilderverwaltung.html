<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ausbilderverwaltung · WTplus</title>
<style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}header img{height:70px;max-width:30%;object-fit:contain}main{max-width:950px;margin:20px auto;padding:16px}.card{background:#111;border:1px solid #333;border-radius:12px;padding:18px;margin:12px 0}h1{margin:0 0 10px}p{color:#bbb}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select{padding:10px;background:#050505;color:white;border:1px solid #555;border-radius:8px;font:inherit}input{flex:1;min-width:180px}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font:inherit;background:#fff;color:#000}button:disabled{opacity:.45;cursor:not-allowed}.danger{background:#8f2626;color:#fff}.secondary{background:#333;color:#fff}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid #333;flex-wrap:wrap}.item small{display:block;color:#aaa;margin-top:5px;overflow-wrap:anywhere}.actions{display:flex;gap:8px}.error{color:#ff8585}dialog{background:#111;color:white;border:1px solid #555;border-radius:12px;width:min(95vw,500px)}dialog::backdrop{background:#000b}label{display:block;margin:12px 0 5px}dialog input,dialog select{width:100%}.home{position:fixed;bottom:16px;left:16px;border-radius:50%;width:48px;height:48px;padding:10px}.home img{width:100%}@media(max-width:600px){header img{height:42px}}</style></head><body>
<header><img src="pluslogo.jpg" alt="WTplus"><img src="faust.jpg" alt="Logo"><img src="Ewto.jpg" alt="EWTO"></header>
<main><section class="card"><h1>👥 Ausbilderverwaltung</h1><p id="scope">Prüfe Berechtigung …</p><div class="toolbar"><input id="search" placeholder="Nach Anzeigename oder UID suchen" aria-label="Ausbilder suchen"><button id="refresh">Aktualisieren</button></div><p id="status" role="status"></p><div id="list"></div></section></main>
<button class="home" onclick="location.href='hauptseite.html'" aria-label="Zur Startseite"><img src="home.jpg" alt=""></button>
<dialog id="editor"><form id="editForm"><h2>Profil bearbeiten</h2><p id="editUid"></p><label for="name">Anzeigename (aus Firestore synchronisiert)</label><input id="name" maxlength="120" readonly title="Der Name wird beim Anmelden aus Firebase Authentication nach Firestore synchronisiert."><label for="role">Rolle</label><select id="role"><option value="trainer">Trainer</option><option value="si-fu">Si-Fu</option><option value="admin">Admin</option></select><label for="school">Schule / Gruppe</label><select id="school"></select><p id="editNotice">Der Anzeigename wird über die Haupt- und Profilseite aus Firebase Authentication synchronisiert. Änderungen am Namen erfolgen weiterhin unter „Mein Profil“.</p><div class="toolbar"><button type="button" class="secondary" id="cancel">Abbrechen</button><button type="submit" id="save">Speichern</button></div></form></dialog>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<script>
if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);let selfUid='',allowed=new Set(),records=[],editing=null;
const norm=s=>String(s||'').trim().toLowerCase(),normalizeRole=s=>{s=norm(s);return ['administrator','admins','adminstrator'].includes(s)?'admin':(['sifu','si fu'].includes(s)?'si-fu':s)};
const roleLabel=s=>({'admin':'Admin','si-fu':'Si-Fu','trainer':'Trainer'})[normalizeRole(s)]||s;
function message(s,error=false){$('status').textContent=s;$('status').className=error?'error':''}
function split(v){return Array.isArray(v)?v:String(v||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean)}
async function groupSchools(group){for(const key of [group,group.toUpperCase(),group.toLowerCase()]){const snap=await db.collection('Schulen').doc(key).get();if(snap.exists){const d=snap.data()||{};return [snap.id,...split(d.School||d.school||d.schools)]}}return [group]}
async function init(user){selfUid=user.uid;const mine=await db.collection('rollen').doc(selfUid).get();if(!mine.exists||normalizeRole(mine.data().role)!=='admin'){message('Zugriff nur für Administratoren.',true);return}const base=String(mine.data().school||mine.data().schule||'').trim();if(!base){message('Keine Schule zugeordnet.',true);return}if(base.toUpperCase()==='MASTER'){const groups=await db.collection('Schulen').get();allowed=new Set(['master',...groups.docs.map(d=>norm(d.id))]);for(const doc of groups.docs)for(const s of split(doc.data().School||doc.data().school||doc.data().schools))allowed.add(norm(s));$('scope').textContent='MASTER · alle registrierten Gruppen und Schulen'}else{allowed=new Set((await groupSchools(base)).map(norm));$('scope').textContent='Gruppe / Schule: '+base}await load()}
async function load(){message('Lade Ausbilderprofile aus Firestore …');try{const snapshot=await db.collection('rollen').get();records=snapshot.docs.map(doc=>({uid:doc.id,...doc.data()})).filter(r=>allowed.has(norm(r.school||r.schule))).map(r=>({...r,displayName:r.anzeigename||'',role:r.role||r.rolle||'',school:r.school||r.schule||''}));records.sort((a,b)=>String(a.displayName||a.uid).localeCompare(String(b.displayName||b.uid),'de'));render();message(records.length+' Profil(e) gefunden. Fehlende Anzeigenamen werden beim nächsten Anmelden synchronisiert.')}catch(e){records=[];render();message('Firestore-Profile konnten nicht geladen werden: '+e.message+'. Bitte die Firestore-Sicherheitsregeln prüfen.',true)}}
function render(){const list=$('list');list.replaceChildren();const query=norm($('search').value);let count=0;for(const r of records){if(![r.displayName,r.uid,r.school,r.role].some(v=>norm(v).includes(query)))continue;count++;const row=document.createElement('div');row.className='item';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=r.displayName||'Profil ohne Namen';const meta=document.createElement('small');meta.textContent=[roleLabel(r.role),r.school||r.schule||'–',`UID: ${r.uid}`].join(' · ');info.append(title,meta);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.textContent='✏️ Bearbeiten';edit.onclick=()=>openEdit(r);const del=document.createElement('button');del.textContent='🗑️ Löschen';del.className='danger';del.disabled=r.uid===selfUid;del.title=r.uid===selfUid?'Eigenes Profil kann nicht gelöscht werden':'Firestore-Profil entfernen';del.onclick=()=>remove(r);actions.append(edit,del);row.append(info,actions);list.append(row)}if(!count){const p=document.createElement('p');p.textContent='Keine passenden Profile.';list.append(p)}}
function openEdit(r){editing=r;$('editUid').textContent='UID: '+r.uid;$('name').value=r.displayName||'';$('role').value=normalizeRole(r.role);if(!['admin','si-fu','trainer'].includes($('role').value))$('role').value='trainer';$('role').disabled=r.uid===selfUid;const select=$('school');select.replaceChildren();for(const s of allowed){const opt=document.createElement('option');opt.value=s;opt.textContent=s;select.append(opt)}select.value=norm(r.school||r.schule);if(!select.value&&select.options.length)select.selectedIndex=0;$('editor').showModal()}
$('cancel').onclick=()=>$('editor').close();$('editForm').onsubmit=async e=>{e.preventDefault();if(!editing)return;const uid=editing.uid,school=$('school').value;if(!allowed.has(norm(school))){message('Schule nicht zulässig.',true);return}const patch={school};if(uid!==selfUid)patch.role=$('role').value;$('save').disabled=true;try{const snap=await db.collection('rollen').doc(uid).get();if(!snap.exists||!allowed.has(norm(snap.data().school||snap.data().schule)))throw Error('Profil nicht mehr im Zuständigkeitsbereich.');await db.collection('rollen').doc(uid).update(patch);$('editor').close();await load()}catch(err){message('Speichern fehlgeschlagen: '+err.message,true)}finally{$('save').disabled=false}};
async function remove(r){if(r.uid===selfUid)return;const confirmation=confirm('Profil „'+(r.displayName||r.uid)+'“ aus Firestore entfernen?\n\nACHTUNG: Das Firebase-Authentication-Konto wird dadurch NICHT gelöscht. Vorhandene Trainingsdaten bleiben erhalten.\n\nFortfahren?');if(!confirmation)return;try{const ref=db.collection('rollen').doc(r.uid);const snap=await ref.get();if(!snap.exists||!allowed.has(norm(snap.data().school||snap.data().schule)))throw Error('Profil nicht mehr im Zuständigkeitsbereich.');await ref.delete();await load();message('Firestore-Profil entfernt. Das Authentication-Konto besteht weiterhin.')}catch(e){message('Löschen fehlgeschlagen: '+e.message,true)}}
$('search').addEventListener('input',render);$('refresh').onclick=load;auth.onAuthStateChanged(user=>{if(!user){location.href='index.html';return}init(user).catch(e=>message('Fehler: '+e.message,true))});
</script></body></html>
